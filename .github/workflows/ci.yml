name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate-wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v4

  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check whitespace errors
        run: git diff --check HEAD^ HEAD
      - name: Build and test
        run: ./gradlew build
      - name: Fault-injection load test (seven phones, drops, partition, restart)
        run: |
          ./gradlew :server:faultTest
          grep -ho 'fault-load[^&<]*' server/build/test-results/faultTest/*.xml
      - name: Smoke-test the standalone server distribution
        run: |
          ./gradlew :server:installDist
          SERVER_OPTS="-DuJudge.postgres.installationDirectory=$PWD/server/build/postgres-bundle" \
            server/build/install/server/bin/server --smoke-test --data-directory="$RUNNER_TEMP/ujudge-data"

  secrets:
    name: Secrets check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan tracked files and the full history
        run: scripts/check-secrets.sh
