name: Build Distributions
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/wrapper-validation-action@v3
      - uses: gradle/actions@v2
        with:
          arguments: packageDistributionForCurrentOS
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: shared/build/compose/binaries/main/dmg/*.dmg

  windows:
    runs-on: windows-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/wrapper-validation-action@v3
      - uses: gradle/actions@v2
        with:
          arguments: packageDistributionForCurrentOS
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: shared/build/compose/binaries/main/msi/*.msi

  linux:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/wrapper-validation-action@v3
      - uses: gradle/actions@v2
        with:
          arguments: packageDistributionForCurrentOS
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: shared/build/compose/binaries/main/deb/*.deb
