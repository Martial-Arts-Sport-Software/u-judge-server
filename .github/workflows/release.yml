name: Build Installers

# Manual only. Builds the installers on clean GitHub runners, installs the DMG and the MSI, runs the headless `--smoke-test`
# (bundled server + managed PostgreSQL, health over pinned TLS, stop) twice against one data directory and uninstalls;
# on Windows the runs use a standard local user, as PostgreSQL refuses an elevated session.
# The installers and smoke reports are kept as workflow artifacts; nothing is released or published.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A regression in scoring, sync, import or export blocks the installers (REL-006).
  verify:
    name: Build, tests and fault-injection load test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build :server:faultTest

  macos:
    name: macOS DMG
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build macOS installer (.dmg)
        run: ./gradlew :desktop:packageDistributionForCurrentOS

      - name: Install, smoke-test and uninstall the DMG
        run: |
          set -euo pipefail
          sw_vers
          dmg=$(ls desktop/build/compose/binaries/main/dmg/*.dmg)
          ls -l "$dmg"
          mount="$RUNNER_TEMP/ujudge-dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          cp -R "$mount/UJudgeServer.app" /Applications/
          hdiutil detach "$mount"
          app=/Applications/UJudgeServer.app/Contents/MacOS/UJudgeServer
          data="$RUNNER_TEMP/ujudge-data"
          mkdir -p smoke
          for run in 1 2; do
            "$app" --smoke-test --data-directory="$data" --report="smoke/macos-run-$run.txt" ||
              { tail -n 60 "$data"/logs/*; exit 1; }
          done
          test "$(grep '^peerId=' smoke/macos-run-1.txt)" = "$(grep '^peerId=' smoke/macos-run-2.txt)"
          cp -R "$data/logs" smoke/macos-logs
          rm -rf /Applications/UJudgeServer.app "$data"
          test ! -e /Applications/UJudgeServer.app

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: desktop/build/compose/binaries/main/dmg/*.dmg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-smoke
          path: smoke/
          if-no-files-found: ignore

  windows:
    name: Windows MSI
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build Windows installer (.msi)
        run: ./gradlew.bat :desktop:packageDistributionForCurrentOS

      - name: Install, smoke-test and uninstall the MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [System.Environment]::OSVersion.VersionString
          $msi = (Get-ChildItem desktop/build/compose/binaries/main/msi/*.msi | Select-Object -First 1).FullName
          Get-Item $msi | Format-List Name, Length
          New-Item -ItemType Directory -Force smoke | Out-Null
          $install = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /l*v `"$PWD\smoke\windows-install.log`"" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "msiexec /i exited with $($install.ExitCode)" }
          $exe = Get-ChildItem -Path $env:ProgramFiles, $env:LOCALAPPDATA -Filter UJudgeServer.exe -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($null -eq $exe) { throw "UJudgeServer.exe was not installed" }
          "Installed: $($exe.FullName)"
          # The runner session is elevated, and PostgreSQL refuses to run with administrator rights: the app must say so.
          $elevated = "$PWD\smoke\windows-elevated.txt"
          $check = Start-Process $exe.FullName -ArgumentList "--smoke-test --data-directory=`"$env:RUNNER_TEMP\ujudge-elevated`" --report=`"$elevated`"" -Wait -PassThru
          Get-Content $elevated
          if ($check.ExitCode -eq 0 -or -not (Select-String -Path $elevated -Pattern 'administrator rights' -Quiet)) {
            throw "An elevated run must fail with the administrator diagnostic"
          }
          # An operator runs the app as a standard user: an ephemeral local account with a random password does the same.
          $plain = -join ((48..57) + (65..90) + (97..122) | Get-Random -Count 20 | ForEach-Object { [char]$_ }) + 'aA1!'
          net user ujudge-smoke $plain /add | Out-Null
          $credential = New-Object System.Management.Automation.PSCredential('ujudge-smoke', (ConvertTo-SecureString $plain -AsPlainText -Force))
          $work = 'C:\ujudge-smoke'
          New-Item -ItemType Directory -Force $work | Out-Null
          icacls $work /grant 'ujudge-smoke:(OI)(CI)F' | Out-Null
          $data = "$work\data"
          foreach ($run in 1, 2) {
            $report = "$work\run-$run.txt"
            $check = Start-Process $exe.FullName -Credential $credential -LoadUserProfile -WorkingDirectory $work `
              -ArgumentList "--smoke-test --data-directory=`"$data`" --report=`"$report`"" -Wait -PassThru
            if (Test-Path $report) { Get-Content $report; Copy-Item $report "smoke\windows-run-$run.txt" }
            if ($check.ExitCode -ne 0) {
              Get-ChildItem "$data\logs" -ErrorAction SilentlyContinue | ForEach-Object { "== $($_.Name)"; Get-Content $_.FullName -Tail 60 }
              throw "Smoke test run $run exited with $($check.ExitCode)"
            }
          }
          $peer1 = Select-String -Path smoke\windows-run-1.txt -Pattern '^peerId='
          $peer2 = Select-String -Path smoke\windows-run-2.txt -Pattern '^peerId='
          if ($peer1.Line -ne $peer2.Line) { throw "The peer ID changed between runs" }
          Copy-Item -Recurse "$data\logs" smoke\windows-logs
          $uninstall = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "msiexec /x exited with $($uninstall.ExitCode)" }
          if (Test-Path $exe.FullName) { throw "UJudgeServer.exe is still installed" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: desktop/build/compose/binaries/main/msi/*.msi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke
          path: smoke/
          if-no-files-found: ignore

  linux:
    name: Linux DEB
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build Linux installer (.deb)
        run: ./gradlew :desktop:packageDistributionForCurrentOS

      # Linux is not a pilot platform and has no installed-app smoke test: jpackage drops the executable bits of the
      # bundled PostgreSQL, which the app restores only in a writable location (macOS /Applications), not in /opt.
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: desktop/build/compose/binaries/main/deb/*.deb
